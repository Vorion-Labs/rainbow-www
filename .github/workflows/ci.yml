name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Deploys the `rainbow-www` Worker once CI passes on main (or on a manual run
  # from main). Without the CLOUDFLARE_API_TOKEN secret it warns and skips,
  # so the pipeline never fails for lack of credentials.
  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when CLOUDFLARE_API_TOKEN is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy. Add the repo secret to enable auto-deploy to production."
      - uses: actions/checkout@v6
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v6
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # Only pass the account ID when it is set; tokens scoped to one
          # account don't need it.
          if [ -n "$CF_ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"; fi
          npm run deploy:cf
